services:
  app:
    build: .
    image: template-nestjs
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      # SQLite file lives on the named volume
      DATABASE_URL: file:/app/data/app.db
      # Production logging defaults (override in .env if needed)
      LOG_PRETTY: "false"
      LOG_CONSOLE: "true"
      LOG_FILE_ENABLED: "true"
      # Relative to /app; the pino-roll transport joins it with process.cwd()
      LOG_DIR: logs
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - app-data:/app/data
      # Logs are written directly to ./logs on the host machine
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/Users').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  app-data:
